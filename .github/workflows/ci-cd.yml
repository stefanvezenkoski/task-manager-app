name: CI/CD - Build and push docker images

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: task-manager-backend
  FRONTEND_IMAGE: task-manager-frontend

jobs:
  build-and-push-backend:
    name: Build & push backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build i push - backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & push frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build и push - frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  deploy:
    name: Deploy to local k3d cluster
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Restart deployments (повлекува нови :latest слики)
        run: |
          kubectl rollout restart deployment/backend -n task-manager
          kubectl rollout restart deployment/frontend -n task-manager

      - name: Провери статус на rollout
        run: |
          kubectl rollout status deployment/backend -n task-manager --timeout=90s
          kubectl rollout status deployment/frontend -n task-manager --timeout=90s

      - name: Финална проверка
        run: kubectl get pods -n task-manager